<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Склад</title>
    <meta name="theme-color" content="#2343B8">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232343B8'/%3E%3Cpath d='M8 13l8-5 8 5v11H8z' fill='none' stroke='white' stroke-width='2.4' stroke-linejoin='round'/%3E%3Cpath d='M12 24v-6h8v6' fill='none' stroke='%2337D0C8' stroke-width='2.4'/%3E%3C/svg%3E">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap&subset=cyrillic" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('sklad.theme') || 'light';
                if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.dataset.theme = t;
            } catch (e) { document.documentElement.dataset.theme = 'light'; }
        })();
    </script>
</head>
<body>
<div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Главное меню">
        <a class="brand" href="#/">
            <span class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 32 32"><path d="M8 13l8-5 8 5v11H8z"/><path class="brand-door" d="M12 24v-6h8v6"/></svg>
            </span>
            <span class="brand-text">
                <span class="brand-name" id="brandName">Мой склад</span>
                <span class="brand-sub">Учёт товаров</span>
            </span>
        </a>
        <nav class="nav" id="nav"></nav>
        <div class="sidebar-foot">
            <button class="nav-item" type="button" data-action="toggle-theme">
                <span class="icon" data-icon="moon"></span><span class="nav-label" id="themeLabel">Тёмная тема</span>
            </button>
        </div>
    </aside>
    <div class="scrim" id="scrim" data-action="close-menu"></div>

    <div class="main">
        <header class="topbar">
            <button class="icon-btn menu-btn" type="button" data-action="open-menu" aria-label="Открыть меню">
                <span class="icon" data-icon="menu"></span>
            </button>
            <div class="search" id="globalSearch">
                <span class="icon search-icon" data-icon="search"></span>
                <input id="globalSearchInput" type="search" autocomplete="off"
                       placeholder="Найти товар, код, штрихкод или список" aria-label="Поиск">
                <kbd class="search-kbd">/</kbd>
                <div class="search-results popover" id="globalSearchResults" hidden></div>
            </div>
            <div class="topbar-right">
                <span class="today" id="today"></span>
                <div class="pop-anchor">
                    <button class="icon-btn" type="button" data-action="toggle-notifications" aria-label="Уведомления">
                        <span class="icon" data-icon="bell"></span>
                        <span class="badge-dot" id="notifCount" hidden></span>
                    </button>
                    <div class="popover notif-panel" id="notifPanel" hidden></div>
                </div>
                <div class="pop-anchor">
                    <button class="profile-btn" type="button" data-action="toggle-profile" aria-label="Профиль">
                        <span class="avatar" id="avatar">А</span>
                        <span class="profile-name" id="profileName"></span>
                        <span class="icon chevron" data-icon="chevron-down"></span>
                    </button>
                    <div class="popover profile-panel" id="profilePanel" hidden></div>
                </div>
            </div>
        </header>
        <main class="page" id="page" tabindex="-1"></main>
    </div>
</div>

<div id="modalRoot"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
