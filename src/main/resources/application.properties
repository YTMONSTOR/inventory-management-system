
spring.application.name=sklad
server.port=${APP_PORT:8080}


spring.datasource.url=${SKLAD_DB_URL:jdbc:postgresql://localhost:5432/sklad}
spring.datasource.username=${SKLAD_DB_USER:sklad}
spring.datasource.password=${SKLAD_DB_PASSWORD:sklad}


spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=false


app.data-dir=${APP_DATA_DIR:${user.home}/sklad-data}


spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=60MB

# JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Tashkent
spring.jackson.default-property-inclusion=always

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml

spring.web.resources.cache.cachecontrol.no-cache=true
